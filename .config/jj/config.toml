#:schema https://docs.jj-vcs.dev/latest/config-schema.json

[user]
name = "David Grisham"
email = "dmgrisham@gmail.com"

[ui]
# :git emits git-format diffs; delta renders them (styling in git config [delta]).
# delta is the default pager because it passes non-diff output (jj log) through
# unharmed. diffnav is a diff-only TUI and would break jj log as the global pager,
# so it's scoped to the `jj diffnav` alias below instead.
diff-formatter = ":git"
pager = "delta"
# difftastic (structural, dir-based) instead needs diff-formatter, not pager:
#   diff-formatter = ["difft", "--color=always", "--display=side-by-side-show-both", "$left", "$right"]

[aliases]
# `jj diffnav [args]` — view the diff in the diffnav TUI. Overrides the pager for
# this one command only (jj log etc. keep using delta). Extra args pass through,
# e.g. `jj diffnav -r @-` or `jj diffnav path/`.
diffnav = ["diff", "--config", "ui.pager=diffnav"]

# lazyjj renders jj's own colored diff (not delta). Use git format so add/remove
# is whole-line, then color those as red/green *background* (fg=default) with no
# token underline. Only affects jj's native color output (lazyjj, piped jj diff);
# the delta-rendered terminal `jj diff` is unaffected.
[lazyjj]
diff-format = "git"

[colors]
# muted dark bg (matches delta's rgb(0,40,0)/rgb(63,0,1)) — plain "green"/"red"
# were the terminal's full-brightness ANSI colors, too bright.
"diff added" = { fg = "default", bg = "#004800" }
"diff removed" = { fg = "default", bg = "#5a0000" }
"diff token" = { underline = false }

# log colors. "working_copy X" entries override the plain ones on the @ row, so
# each is set too (bright variant keeps @ slightly emphasized).
change_id = "yellow"
"working_copy change_id" = "bright yellow"
# commit hash prefix: light gray, a step above the bright-black "rest"
commit_id = "white"
"working_copy commit_id" = "white"
author = "#8f8f8f"
committer = "#8f8f8f"
"working_copy author" = "#8f8f8f"
"working_copy committer" = "#8f8f8f"
timestamp = "#adadad"
"working_copy timestamp" = "#adadad"
bookmark = "yellow"
bookmarks = "yellow"
local_bookmarks = "yellow"
remote_bookmarks = "yellow"
"working_copy bookmark" = "bright yellow"
"working_copy bookmarks" = "bright yellow"
"working_copy local_bookmarks" = "bright yellow"
"working_copy remote_bookmarks" = "bright yellow"
# "(empty)" tag on empty commits
empty = "bright black"
"working_copy empty" = "bright black"
# workspace name shown as "<name>@" (not a git branch)
working_copies = "cyan"
"working_copy working_copies" = "bright cyan"
# git tags (release tags pile up; keep them dim)
tag = "bright black"
tags = "bright black"
"working_copy tag" = "bright black"
"working_copy tags" = "bright black"
# "(no description set)" placeholder, same as "(empty)" and "(elided revisions)"
"description placeholder" = "bright black"
"empty description placeholder" = "bright black"
"working_copy description placeholder" = "bright black"
"working_copy empty description placeholder" = "bright black"
